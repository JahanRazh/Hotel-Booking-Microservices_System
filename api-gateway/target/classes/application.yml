server:
  port: 8086

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # ── Auth Service ──────────────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback

        # ── Customer Service ──────────────────────────────────────────
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/customers/**
          filters:
            - AuthenticationFilter

        # ── Room Service ──────────────────────────────────────────────
        - id: room-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/rooms/**
          filters:
            - AuthenticationFilter

        # ── Booking Service ───────────────────────────────────────────
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/bookings/**
          filters:
            - AuthenticationFilter

        # ── Payment Service ───────────────────────────────────────────
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        # ── Swagger API Docs Routes (for aggregated UI) ───────────────
        - id: auth-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

        - id: customer-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/customer-service/v3/api-docs
          filters:
            - RewritePath=/customer-service/v3/api-docs, /v3/api-docs

        - id: room-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/room-service/v3/api-docs
          filters:
            - RewritePath=/room-service/v3/api-docs, /v3/api-docs

        - id: booking-service-docs
          uri: http://localhost:8084
          predicates:
            - Path=/booking-service/v3/api-docs
          filters:
            - RewritePath=/booking-service/v3/api-docs, /v3/api-docs

        - id: payment-service-docs
          uri: http://localhost:8085
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

# JWT secret — must match auth-service
jwt:
  secret: HotelManagementSystemSecretKey2026VeryLongSecureKeyForJWTTokenGeneration

# Aggregated Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Room Service
        url: /room-service/v3/api-docs
      - name: Booking Service
        url: /booking-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
  api-docs:
    enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.hotel.gateway: DEBUG
